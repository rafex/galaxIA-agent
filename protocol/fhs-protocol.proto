syntax = "proto3";

// FHS Wire Protocol — Protobuf IDL v3
// DEC-0086: Protobuf binario primario, LPP framing (idl/framing.md)
// DEC-0087: Envelope P2P con routing fields, Handshake 2-step, sin CallerAuth
// DEC-P2P-001: Red descentralizada libp2p — DHT para descubrimiento y reputación,
//              GossipSub para ofertas de Mission, streams directos para ejecución.
//              Atlas = bootstrap peer únicamente. Sin registro central.
//
// Versión de referencia: @rafex/galaxia-fhs-protocol
//
// ── Planos de mensajería ──────────────────────────────────────────────────────
//
// 1. STREAM DIRECTO FHS (Envelope, binario)
//    Protocolo libp2p: /fhs/v1/0.1.0
//    Framing LPP:
//      [varint: byte-length del Envelope serializado][Envelope bytes]
//    Ver idl/framing.md para la spec completa.
//
// 2. GOSSIPSUB (mensajes de pubsub, también Protobuf)
//    Publicados en tópicos libp2p GossipSub. No son Envelopes.
//    Cada mensaje GossipSub lleva su propia firma Ed25519.
//    Tópicos:
//      fhs/v1/nodes/advertise     — NodeAdvertiseMessage
//      fhs/v1/missions/offer      — MissionOfferMessage
//      fhs/v1/missions/bid        — MissionBidMessage
//      fhs/v1/missions/assign     — MissionAssignMessage
//      fhs/v1/reputation/update   — ReputationUpdateMessage
//    Ver idl/gossipsub.md y ../docs/p2p.md para la spec completa.

package fhs.v1;

option java_package = "io.galax_ia.fhs.v1";
option java_outer_classname = "FhsProtocol";
option go_package = "github.com/rafex/galaxIA/idl/fhs/v1";

// ── Envelope — Frame de stream directo FHS ────────────────────────────────────
// Frame raíz del stream directo peer-to-peer entre dos nodos FHS.
// Identificado por el protocolo libp2p /fhs/v1/0.1.0.
// Serializado exclusivamente como Protobuf binario con LPP framing
// (idl/framing.md).

message Envelope {
  // ── Campos de routing (nivel de frame) ─────────────────────────────────────
  string message_id     = 1;  // UUID único por frame (deduplicación en redes P2P)
  string source_peer_id = 2;  // DID del nodo emisor (did:key:z...)
  string dest_peer_id   = 3;  // DID del destino; vacío solo en handshake inicial
  int64  timestamp      = 4;  // Unix ms — anti-replay (ventana recomendada ±30 000 ms)
  string version        = 5;  // Versión del protocolo FHS ("1")
  bytes signature        = 6;  // Ed25519 sobre sha256(message_id:source:dest:timestamp:payload_bytes_hex)

  // ── Payload ─────────────────────────────────────────────────────────────────
  oneof payload {
    // Stream directo — Ciclo de vida de conexión        [10-19]
    // Handshake entre CUALQUIER par de nodos FHS, no solo Provider↔Atlas.
    HandshakeMessage        handshake       = 10;
    HandshakeAckMessage     handshake_ack   = 11;
    PingMessage             ping            = 12;
    PongMessage             pong            = 13;
    ErrorMessage            error           = 14;

    // Stream directo — Misiones: Chat (Navigator ↔ Star) [20-29]
    ChatRequestMessage      chat_request    = 20;
    ChatCancelMessage       chat_cancel     = 21;
    ChatDeltaMessage        chat_delta      = 22;
    ChatCompletedMessage    chat_completed  = 23;
    ChatErrorMessage        chat_error      = 24;
    DispatchAckMessage      dispatch_ack    = 25;

    // Stream directo — Misiones: Tool (Navigator ↔ Satellite) [30-39]
    ToolCallRequestMessage  tool_call       = 30;
    ToolCancelMessage       tool_cancel     = 31;
    ToolCallResultMessage   tool_result     = 32;
    ToolCallErrorMessage    tool_error      = 33;
    ToolListRequestMessage  tool_list       = 34;
    ToolListResponseMessage tool_list_resp  = 35;

    // GossipSub — Presencia y descubrimiento             [40-49]
    // Estos mensajes también viajan en GossipSub (tópico fhs/v1/nodes/advertise).
    // Cuando viajan en Envelope (stream directo), son para nodos sin GossipSub activo.
    NodeAdvertiseMessage    node_advertise  = 40;

    // GossipSub — Dispatch de Missions                   [50-59]
    // Publicados en tópicos de GossipSub. En Envelope solo para debugging.
    MissionOfferMessage     mission_offer   = 50;
    MissionBidMessage       mission_bid     = 51;
    MissionAssignMessage    mission_assign  = 52;

    // DHT — Records almacenados en la DHT Kademlia        [53-59]
    DhtBeaconRecord         dht_beacon      = 53;
    DhtReputationRecord     dht_reputation  = 54;

    // Portal ↔ Navigator (interfaz de agente)            [60-69]
    AgentStartMessage         agent_start         = 60;
    AgentStatusMessage        agent_status        = 61;
    StarSelectedMessage       star_selected       = 62;
    ToolSelectedMessage       tool_selected       = 63;
    AssistantDeltaMessage     assistant_delta     = 64;
    AssistantCompletedMessage assistant_completed = 65;
    OcrExtractedMessage       ocr_extracted       = 66;
    KbRecommendedMessage      kb_recommended      = 67;
    // 68 se conserva reservado y no se reutiliza; el OCR es siempre automático.
    KbDecisionMessage         kb_decision         = 69;

    // Ephemeral Satellite (SPEC-EPHSAT-0001)             [70-79]
    MissionFeedbackMessage    mission_feedback    = 70;

    // GossipSub — Reputación                             [80-89]
    ReputationUpdateMessage   reputation_update   = 80;
  }
}

// ── Tipos estructurados wire ─────────────────────────────────────────────────

// Todos los datos estructurados del protocolo tienen representación Protobuf.
// No se acepta ningún documento de texto o esquema dentro de campos string o
// bytes para representar datos estructurados del protocolo.

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_STAR         = 1;
  PROVIDER_TYPE_SATELLITE    = 2;
  PROVIDER_TYPE_NOVA         = 3;
  PROVIDER_TYPE_MULTI        = 4;
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC       = 1;
  VISIBILITY_PRIVATE      = 2;
  VISIBILITY_COMMUNITY    = 3;
}

enum RetentionPolicy {
  RETENTION_UNSPECIFIED = 0;
  RETENTION_NONE        = 1;
  RETENTION_SESSION     = 2;
  RETENTION_PERSISTENT  = 3;
}

enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_ANDROID     = 1;
  DEVICE_PLATFORM_IOS         = 2;
  DEVICE_PLATFORM_BROWSER     = 3;
  DEVICE_PLATFORM_DESKTOP     = 4;
}

enum WasmTier {
  WASM_TIER_UNSPECIFIED = 0;
  WASM_TIER_BASELINE    = 1;
  WASM_TIER_SIMD        = 2;
  WASM_TIER_THREADS     = 3;
}

message ProviderIdentity {
  string        id          = 1;
  ProviderType  type        = 2;
  Visibility    visibility  = 3;
  string        name        = 4;
  string        description = 5;
  string        region      = 6;
  repeated string tags      = 7;
  bool          ephemeral   = 8;
  string        delegated_by = 9;
  int32         lease_seconds = 10;
}

message Endpoint {
  string multiaddr = 1;
}

message DeviceInfo {
  string          fingerprint = 1;
  DevicePlatform  platform    = 2;
  WasmTier        wasm_tier   = 3;
}

message PrivacyPolicy {
  RetentionPolicy retention    = 1;
  string          jurisdiction = 2;
  bool            training_use = 3;
}

message Availability {
  int32 max_concurrent_requests = 1;
}

enum ModelCapability {
  MODEL_CAPABILITY_UNSPECIFIED = 0;
  MODEL_CAPABILITY_CHAT        = 1;
  MODEL_CAPABILITY_COMPLETION  = 2;
  MODEL_CAPABILITY_EMBEDDING   = 3;
  MODEL_CAPABILITY_VISION      = 4;
  MODEL_CAPABILITY_TOOL_CALLING = 5;
}

// Fuente del contexto RAG seleccionada al crear una conversación.
// El MVP soporta exactamente una fuente por conversación: local o network.
// No se define una opción "ambos" hasta que exista una política de fusión.
enum RagSource {
  RAG_SOURCE_UNSPECIFIED = 0;
  RAG_SOURCE_LOCAL       = 1; // Índice efímero en el navegador Portal.
  RAG_SOURCE_NETWORK     = 2; // Satellite RAG descubierto en la red GalaxIA.
}

message ModelDescriptor {
  string id                    = 1;
  string display_name          = 2;
  repeated ModelCapability capabilities = 3;
  int32 context_window         = 4;
  repeated string languages    = 5;
  bool tool_calling            = 6;
}

message CapabilityDescriptor {
  string id                         = 1;
  string name                       = 2;
  string description                = 3;
  repeated string input_media_types = 4;
  repeated string output_media_types = 5;
  repeated string languages         = 6;
}

message AgentCapability {
  string id          = 1;
  string name        = 2;
  string description = 3;
}

message Beacon {
  string             fhs_version       = 1;
  ProviderIdentity   provider          = 2;
  Endpoint           endpoint           = 3;
  DeviceInfo        device             = 4;
  PrivacyPolicy     privacy            = 5;
  Availability      availability       = 6;
  repeated ModelDescriptor models      = 7;
  repeated CapabilityDescriptor capabilities = 8;
  repeated AgentCapability agent_capabilities = 9;
  repeated string preferred_stars      = 10;
}

message DynamicValue {
  oneof kind {
    bool boolean_value       = 1;
    int64 integer_value      = 2;
    double number_value      = 3;
    string string_value      = 4;
    bytes bytes_value        = 5;
    DynamicObject object_value = 6;
    DynamicList list_value   = 7;
    ArtifactRef artifact_ref = 8;
  }
}

// Referencia canónica a un binario (DEC-0046/0047). El endpoint de escritura
// nunca viaja por FHS: inline transporta los bytes directamente y ipfs solo
// transporta la referencia de lectura que el provider debe resolver.
message ArtifactRef {
  oneof transport {
    InlineArtifact inline = 1;
    IpfsArtifact ipfs      = 2;
  }
}

message InlineArtifact {
  bytes data     = 1;
  string filename = 2;
}

message IpfsArtifact {
  string cid         = 1;
  string network     = 2;  // public | private
  string gateway_url = 3;  // endpoint de lectura; nunca API de escritura
  string filename    = 4;
  string retention   = 5;  // ephemeral | reuse
}

message DynamicObject {
  map<string, DynamicValue> fields = 1;
}

message DynamicList {
  repeated DynamicValue values = 1;
}

message ToolInputSchema {
  string type                  = 1;
  string description           = 2;
  map<string, ToolInputSchema> properties = 3;
  repeated string required     = 4;
  repeated string enum_values  = 5;
}

// ── Ciclo de vida de stream directo ──────────────────────────────────────────
// El handshake se establece entre CUALQUIER par de nodos FHS (no solo con Atlas).
// Flujo: handshake → handshake_ack → ping/pong (cada heartbeatSeconds).
// La identidad viene de Envelope.source_peer_id (DID del nodo).
// La autenticación bilateral usa Envelope.signature (cada sentido firma su Envelope).

// handshake — Nodo A → Nodo B
// Primer mensaje al abrir un stream libp2p /fhs/v1/0.1.0.
// El Nodo A se presenta con su Beacon y sus multiaddrs.
// Si es un Ephemeral Satellite, incluye delegation_token.
message HandshakeMessage {
  string          fhs_version      = 1;  // Versión del protocolo FHS que soporta este nodo
  repeated string listen_addrs     = 2;  // Multiaddrs libp2p del nodo
  Beacon          beacon           = 3;  // Beacon tipado en Protobuf
  DelegationToken delegation_token = 4;  // Solo para Ephemeral Satellites (SPEC-EPHSAT-0001)
}

// handshake_ack — Nodo B → Nodo A
// Confirma que el stream está establecido. Devuelve parámetros de sesión.
message HandshakeAckMessage {
  string fhs_version       = 1;  // Versión del protocolo acordada para esta sesión
  int32  lease_seconds     = 2;  // Duración del lease del stream en segundos (default 30)
  int32  heartbeat_seconds = 3;  // Intervalo de ping recomendado en segundos (default 10)
  int64  lease_expires     = 4;  // Unix ms cuando vence el lease actual
  int32  accepted_services = 5;  // Número de capabilities reconocidas del Beacon
  string trust_level       = 6;  // "standard" | "delegated" | "community" | "unverified"
}

// ping — Nodo A → Nodo B (Pulse / heartbeat)
// Emitido cada heartbeatSeconds para renovar el lease del stream.
message PingMessage {}

// pong — Nodo B → Nodo A
// Respuesta al ping. Conserva server_timestamp para calcular RTT.
message PongMessage {
  int64 server_timestamp = 1;  // Unix ms cuando el receptor procesa el ping
}

// error — cualquier nodo → cualquier nodo
enum FhsErrorCode {
  FHS_ERROR_CODE_UNSPECIFIED    = 0;
  NOT_IDENTIFIED                = 1;  // Mensaje recibido antes de handshake completo
  INVALID_MANIFEST              = 2;  // Beacon no cumple el schema mínimo; o no anuncia una multiaddr libp2p válida
  INVALID_SIGNATURE             = 3;  // Firma inválida en Envelope, GossipSub message o DHTRecord
  UNSUPPORTED_VERSION           = 4;  // fhsVersion no compatible
  UPSTREAM_UNAVAILABLE          = 5;  // Servicio detrás del provider no responde
  UPSTREAM_TIMEOUT              = 6;  // Servicio respondió más lento que el timeout
  INVALID_ARGUMENTS             = 7;  // Argumentos de tool.call/chat.request inválidos
  UNSUPPORTED_CAPABILITY        = 8;  // Capability o modelo no disponible en el provider
  UNAUTHORIZED                  = 9;  // source_peer_id/signature inválidos o vetados
  CANCELLED                     = 10; // Petición abortada tras chat.cancel/tool.cancel
  OVERLOADED                    = 11; // Nodo a capacidad máxima
  INTERNAL_ERROR                = 12; // Fallo no clasificado
  // Ephemeral Satellite (SPEC-EPHSAT-0001)
  DELEGATION_INVALID            = 13; // DelegationToken: firma inválida o campos mal formados
  DELEGATION_EXPIRED            = 14; // DelegationToken.expires_at vencido o Host sin stream activo
  WASM_HASH_MISMATCH            = 15; // Hash SHA-256 del WASM no coincide con DelegationToken.wasm_hash
  // P2P (DEC-P2P-001)
  PEER_UNREACHABLE              = 16; // libp2p no puede establecer conexión con el peer
  DHT_RECORD_INVALID            = 17; // Registro DHT con firma inválida, expirado o malformado
  BID_TIMEOUT                   = 18; // Navigator no recibió bids antes de bid_deadline_ms
  BID_REJECTED                  = 19; // Provider rechazó una oferta de Mission (sin capacidad, trust insuficiente, etc.)
}

message ErrorMessage {
  FhsErrorCode code    = 1;
  string       message = 2;  // Descripción legible (no machine-readable)
}

// ── Tipos base ───────────────────────────────────────────────────────────────

message Message {
  string            role         = 1;  // user | assistant | system | tool
  string            content      = 2;
  string            tool_call_id = 3;  // Solo cuando role == "tool"
  repeated ToolCall tool_calls   = 4;
}

message ToolDefinition {
  string name         = 1;
  string description  = 2;
  ToolInputSchema input_schema = 3;  // Schema tipado en Protobuf
}

message ToolCall {
  string           id       = 1;
  string           type     = 2;  // Siempre "function"
  ToolCallFunction function = 3;
}

message ToolCallFunction {
  string name      = 1;
  DynamicValue arguments = 2;  // Argumentos tipados en Protobuf
}

// ── Mensajes de misión — Chat ─────────────────────────────────────────────────
// El callerId viene de Envelope.source_peer_id.
// La autenticación viene de Envelope.signature.
// El timestamp viene de Envelope.timestamp.

// chat.request — Navigator → Star (stream directo)
message ChatRequestMessage {
  string              mission_id = 1;
  repeated Message    messages   = 2;
  repeated ToolDefinition tools  = 3;
  string              model      = 4;  // Modelo LLM solicitado (opcional)
  repeated ArtifactRef artifacts = 5; // Adjuntos declarativos, no JSON/base64 ad hoc
  DocumentContext     document_context = 6; // Fragmentos RAG acotados para este turno
  string              document_id = 7; // Identificador estable del documento RAG
}

// Contexto documental efímero asociado a una petición de chat.
// Se transporta como estructura Protobuf para que cualquier implementación
// pueda reutilizar fragmentos recuperados en preguntas posteriores sin
// interpretar marcadores embebidos en Message.content ni recibir el OCR entero.
message DocumentContext {
  string filename = 1; // Compatibilidad con clientes FHS v0.1 anteriores.
  string text     = 2 [deprecated = true]; // No enviar OCR completo; usar chunks.
  string document_id = 3;
  repeated DocumentChunk chunks = 4;
  RagSource source = 5;
  string embedding_model = 6;
  int32 embedding_dimensions = 7;
}

// Fragmento recuperado por el RAG seleccionado. El texto está acotado por el
// cliente/provider antes de llegar al LLM; no representa el documento entero.
message DocumentChunk {
  string chunk_id = 1;
  string filename = 2;
  int32 chunk_index = 3;
  string text = 4;
  float score = 5;
  string source = 6;
}

// chat.cancel — Portal → Navigator (stream directo)
message ChatCancelMessage {
  string mission_id = 1;
}

// chat.delta — Star → Navigator (stream directo, streaming)
message ChatDeltaMessage {
  string mission_id = 1;
  string delta      = 2;
}

// chat.completed — Star → Navigator (stream directo)
message ChatCompletedMessage {
  string            mission_id = 1;
  string            content    = 2;
  repeated ToolCall tool_calls = 3;
}

// chat.error — Star → Navigator (stream directo)
message ChatErrorMessage {
  string mission_id = 1;
  string error      = 2;
}

// dispatch.ack — Provider → Navigator (stream directo)
// El provider confirma que encoló la misión. queued_at es el timestamp de negocio.
message DispatchAckMessage {
  string mission_id = 1;
  int64  queued_at  = 2;
}

// ── Mensajes de misión — Tool ─────────────────────────────────────────────────

// tool.call — Navigator → Satellite (stream directo)
message ToolCallRequestMessage {
  string            mission_id = 1;
  repeated ToolCall tool_calls = 2;
}

// tool.cancel — Navigator → Satellite (stream directo)
message ToolCancelMessage {
  string mission_id = 1;
}

// tool.result — Satellite → Navigator (stream directo)
message ToolCallResultMessage {
  string mission_id   = 1;
  string tool_call_id = 2;
  DynamicValue result  = 3;  // Resultado tipado en Protobuf
}

// tool.error — Satellite → Navigator (stream directo)
message ToolCallErrorMessage {
  string mission_id   = 1;
  string tool_call_id = 2;
  string error        = 3;
}

// tool.list — Navigator → Satellite (stream directo)
message ToolListRequestMessage {
  string mission_id = 1;
}

// tool.list.response — Satellite → Navigator (stream directo)
message ToolListResponseMessage {
  string               mission_id = 1;
  repeated ToolDefinition tools   = 2;
}

// ── GossipSub — Presencia y descubrimiento ────────────────────────────────────
// Tópico: fhs/v1/nodes/advertise
//
// Publicado periódicamente por CADA nodo activo en la red.
// Reemplaza el modelo Atlas-centralizado de node.online / node.lost.
// Basado en TTL: si un nodo deja de publicar, se considera offline.
// La firma permite verificar sin confiar en el emisor GossipSub.

message NodeAdvertiseMessage {
  string          did          = 1;  // DID del nodo emisor (did:key:z...)
  Beacon          beacon       = 2;  // Beacon tipado en Protobuf
  repeated string multiaddrs   = 3;  // Multiaddrs libp2p del nodo
  int64           timestamp    = 4;  // Unix ms del anuncio
  int32           ttl_seconds  = 5;  // Tiempo de vida del anuncio (default 60s)
  bool            ephemeral    = 6;  // true si es un Ephemeral Satellite (WASM/browser)
  string          delegated_by = 7;  // DID del Nodo Host; solo si ephemeral == true
  string          trust_level  = 8;  // "standard" | "delegated" | "community" | "unverified"
  bytes           signature    = 9;  // Ed25519 del encoding Protobuf determinista de los campos 1-8
}

// ── GossipSub — Dispatch de Missions ─────────────────────────────────────────
// Tópico: fhs/v1/missions/offer  → fhs/v1/missions/bid → fhs/v1/missions/assign
//
// Flujo de asignación descentralizado (reemplaza dispatch centralizado por Atlas):
//   1. Navigator publica MissionOfferMessage en fhs/v1/missions/offer.
//   2. Providers que pueden satisfacer la oferta publican MissionBidMessage.
//   3. Navigator selecciona el bid ganador (por reputación, latencia, trust).
//   4. Navigator publica MissionAssignMessage con el DID del ganador.
//   5. Navigator abre un stream directo /fhs/v1/0.1.0 con el provider ganador.
//   6. La Mission se ejecuta por el stream directo (chat.request / tool.call).

// Tópico: fhs/v1/missions/offer
message MissionOfferMessage {
  string          mission_id            = 1;  // UUID de la misión
  string          navigator_did         = 2;  // DID del Navigator que publica la oferta
  repeated string navigator_multiaddrs  = 3;  // Multiaddrs del Navigator para stream directo post-assign
  string          mission_type          = 4;  // "chat" | "tool_call" | "agent"
  repeated string required_capabilities = 5;  // IDs de capabilities requeridas
  string          preferred_model       = 6;  // Modelo LLM preferido (para mission_type = "chat")
  string          scope                 = 7;  // "local" | "network" | "community" | "external"
  int64           bid_deadline_ms       = 8;  // Unix ms límite para recibir bids
  int64           timestamp             = 9;
  bytes           signature             = 10; // Ed25519 sobre campos 1-9
}

// Tópico: fhs/v1/missions/bid
message MissionBidMessage {
  string          mission_id            = 1;  // UUID de la misión ofertada
  string          provider_did          = 2;  // DID del provider que hace la oferta
  repeated string provider_multiaddrs   = 3;  // Multiaddrs para stream directo
  string          provider_type         = 4;  // "star" | "satellite" | "nova"
  repeated string offered_capabilities  = 5;  // Capabilities que puede ejecutar
  string          offered_model         = 6;  // Modelo LLM disponible (para tipo "chat")
  float           reputation_score      = 7;  // Score local del provider (0.0 - 1.0)
  int32           estimated_latency_ms  = 8;  // Latencia estimada basada en carga actual
  string          trust_level           = 9;  // Trust level del provider
  int64           timestamp             = 10;
  bytes           signature             = 11; // Ed25519 sobre campos 1-10
}

// Tópico: fhs/v1/missions/assign
message MissionAssignMessage {
  string mission_id        = 1;  // UUID de la misión
  string navigator_did     = 2;  // DID del Navigator que asigna
  string assigned_provider = 3;  // DID del provider ganador del bid
  int64  timestamp         = 4;
  bytes  signature         = 5;  // Ed25519 sobre campos 1-4
}

// ── DHT Kademlia — Records almacenados en la red P2P ─────────────────────────
// Key: DID del nodo (did:key:z...)
// Value: DhtBeaconRecord serializado en Protobuf
//
// Cualquier nodo puede publicar y leer de la DHT.
// La firma permite verificar autenticidad sin confiar en nodos intermedios.
// Atlas (como bootstrap) participa en la DHT igual que cualquier otro nodo.

// DHT Key: did del nodo
message DhtBeaconRecord {
  string          did          = 1;  // DID del nodo (coincide con la key DHT)
  Beacon          beacon       = 2;  // Beacon tipado en Protobuf
  repeated string multiaddrs   = 3;  // Multiaddrs P2P del nodo
  int64           published_at = 4;  // Unix ms cuando se publicó
  int64           expires_at   = 5;  // Unix ms de expiración del registro DHT
  string          fhs_version  = 6;  // Versión del protocolo FHS del nodo
  bytes           signature    = 7;  // Ed25519 del encoding Protobuf determinista de los campos 1-6
}

// DHT Key: "reputation/" + DID del provider
// Publicado por Navigators después de completar Missions con el provider.
// Múltiples Navigators contribuyen; cada registro está firmado por el Navigator que lo publica.
message DhtReputationRecord {
  string provider_did     = 1;  // DID del provider evaluado
  string evaluator_did    = 2;  // DID del Navigator que publica este registro
  float  score            = 3;  // Score (0.0 - 1.0; 1.0 = perfecto)
  int64  missions_success = 4;  // Misiones completadas con éxito (según este evaluador)
  int64  missions_failed  = 5;  // Misiones fallidas (según este evaluador)
  float  avg_latency_ms   = 6;  // Latencia promedio
  int64  last_updated     = 7;  // Unix ms de la última actualización
  bytes  signature        = 8;  // Ed25519 del evaluator_did sobre los campos 1-7
}

// ── GossipSub — Reputación ────────────────────────────────────────────────────
// Tópico: fhs/v1/reputation/update
//
// Publicado por Navigator después de completar una Mission.
// Reemplaza el mission.feedback punto-a-punto con Atlas.
// Todos los nodos suscritos pueden actualizar su caché local de reputación.
// Los nodos que mantienen DhtReputationRecord actualizado también usan este mensaje.

message ReputationUpdateMessage {
  string mission_id    = 1;  // UUID de la Mission completada
  string provider_did  = 2;  // DID del provider evaluado
  string navigator_did = 3;  // DID del Navigator que evalúa
  float  latency_ms    = 4;  // Latencia real de la Mission (ms)
  bool   success       = 5;  // true = completó sin error
  string error_code    = 6;  // FhsErrorCode como string; vacío si success = true
  string delegated_by  = 7;  // DID del Nodo Host; solo para Ephemeral Satellites
  int64  timestamp     = 8;
  bytes  signature     = 9;  // Ed25519 del navigator_did sobre los campos 1-8
}

// ── Ephemeral Satellite (SPEC-EPHSAT-0001) ────────────────────────────────────
// DelegationToken — Credencial firmada por el Nodo Host para delegar capacidades
// a un Ephemeral Satellite. Viaja en HandshakeMessage.delegation_token.
//
// La firma cubre los campos 1-5 en su serialización proto canónica (determinista).
// El receptor verifica usando la clave pública Ed25519 derivada del DID issuer
// (did:key:z... codifica la clave pública — no se requiere PKI externa).
// En el modelo P2P, el receptor es cualquier peer que acepte el stream;
// la verificación del Host en DHT reemplaza la verificación "Host en Orbit en Atlas".
message DelegationToken {
  string          issuer       = 1;  // DID del Nodo Host firmante (did:key:z...)
  string          subject      = 2;  // DID del Ephemeral Satellite; debe coincidir con Envelope.sourcePeerId
  repeated string capabilities = 3;  // Capability IDs que el Host delega
  string          wasm_hash    = 4;  // "sha256:<64-hex>" del bundle WASM
  int64           expires_at   = 5;  // Unix ms de expiración del token
  bytes           signature    = 6;  // Ed25519 sobre el canonical proto de campos 1-5
}

// mission.feedback — En el modelo P2P viaja también como ReputationUpdateMessage
// en GossipSub. Este tipo se mantiene para streams directos (ej. Ephemeral Satellite
// reportando directamente a un Nodo Host sin GossipSub activo).
message MissionFeedbackMessage {
  string mission_id    = 1;  // UUID de la Mission completada
  string provider_did  = 2;  // DID del provider evaluado (era satellite_did, generalizado)
  float  latency_ms    = 3;  // Latencia real de la Mission (ms)
  bool   success       = 4;  // true = completó sin error
  string error_code    = 5;  // FhsErrorCode como string; vacío si success = true
  string delegated_by  = 6;  // DID del Nodo Host; solo para Ephemeral Satellites
}

// ── Portal ↔ Navigator (interfaz de agente, IDL-007) ─────────────────────────
// Mensajes que viajan por stream directo entre el Portal y el Navigator.
// El Portal es un cliente; el Navigator es un peer FHS completo.

// agent.start — Portal → Navigator
message AgentStartMessage {
  string session_id = 1;  // UUID de la sesión Portal
  string scope      = 2;  // "local" | "network" | "community" | "external"
  string model      = 3;  // Modelo LLM preferido (hint)
  string kb         = 5;  // Provider KB elegido manualmente (opcional)
  int32  kb_max_per_question = 6;
  bool   ipfs_enabled = 7;
  string ipfs_network = 8; // "public" | "private"
  string ipfs_retention = 9; // "ephemeral" | "reuse"
  RagSource rag_source = 10; // local | network; unspecified conserva local
  reserved 4;
}

// agent.status — Navigator → Portal
message AgentStatusMessage {
  string mission_id = 1;
  string status     = 2;  // "thinking" | "offering" | "waiting_bid" | "assigning" | "calling_star" | "calling_satellite" | "streaming" | "completed" | "error"
}

// star.selected — Navigator → Portal
message StarSelectedMessage {
  string mission_id  = 1;
  string provider_id = 2;  // DID del Star seleccionado
  string model       = 3;  // Modelo LLM que usará el Star
}

// tool.selected — Navigator → Portal
message ToolSelectedMessage {
  string mission_id    = 1;
  string provider_id   = 2;  // DID del Satellite invocado
  string capability_id = 3;  // ID de la capability del Satellite
}

// assistant.delta — Navigator → Portal (streaming)
message AssistantDeltaMessage {
  string mission_id = 1;
  string delta      = 2;
}

// ProvenanceInfo — trazabilidad de la misión
message ProvenanceInfo {
  string           provider_id       = 1;  // DID del Star que generó la respuesta
  string           model             = 2;  // Modelo LLM utilizado
  int32            completion_tokens = 3;  // Tokens generados
  repeated string  tool_provider_ids = 4;  // DIDs de Satellites invocados
  bool             data_exported     = 5;  // true si algún tool exportó datos fuera del nodo
  string           jurisdiction      = 6;  // Jurisdicción legal del Star (ej. "MX")
  float            star_reputation   = 7;  // Score de reputación del Star al momento del dispatch
}

// assistant.completed — Navigator → Portal
message AssistantCompletedMessage {
  string         mission_id = 1;
  string         content    = 2;  // Respuesta completa del agente
  ProvenanceInfo provenance = 3;
}

// ocr.extracted — Navigator → Portal. El texto se transporta como campo
// Protobuf para que el Portal muestre una vista previa y conserve el contexto
// efímero del documento; el uso del OCR es automático cuando hay una pregunta.
message OcrExtractedMessage {
  string mission_id = 1;
  string filename   = 2;
  string text       = 3;
}

message KbCandidate {
  string provider_id = 1;
  string provider_name = 2;
  string description = 3;
}

// kb.recommended — Navigator → Portal.
message KbRecommendedMessage {
  string mission_id = 1;
  repeated KbCandidate candidates = 2;
  bool chosen_by_llm = 3;
}

// kb.decision — Portal → Navigator. La sesión conserva las candidatas
// anunciadas y solo necesita recibir la decisión del usuario.
message KbDecisionMessage {
  string mission_id = 1;
  bool use = 2;
}
