name: galaxIA-agent CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.3'
      - run: cargo fmt --check
      - run: ./scripts/check-idl.sh
      - run: cargo test --all-targets
