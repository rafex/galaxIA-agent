[package]
name = "galaxia-agent"
version = "0.1.0"
edition = "2021"
description = "Agente soberano Rust/Rig para Navigator de galaxIA"
license = "MIT"
publish = false

[dependencies]
galaxia-fhs = { git = "https://github.com/rafex/galaxIA-SDK", branch = "main", features = ["ipfs"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
futures = "0.3"
libp2p = { version = "0.57", features = ["tokio", "tcp", "dns", "websocket", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "macros", "ed25519"] }
libp2p-stream = "0.5.0-alpha"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rig = { version = "=0.42.0", default-features = false, features = ["agent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Copia de libp2p-websocket con tls::Config::from_rustls (verificador por pin
# del certificado del laboratorio). Los [patch] de galaxia-fhs no se heredan.
# Ver galaxIA-SDK/rust/vendor/libp2p-websocket/GALAXIA-PATCH.md
[patch.crates-io]
libp2p-websocket = { git = "https://github.com/rafex/galaxIA-SDK", branch = "main" }
