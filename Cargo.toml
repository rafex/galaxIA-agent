[package]
name = "galaxia-agent"
version = "0.1.0"
edition = "2021"
description = "Agente soberano Rust/Rig para Navigator de galaxIA"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
bs58 = "0.5"
ed25519-dalek = "2"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.57", features = ["tokio", "tcp", "dns", "websocket", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "macros", "ed25519"] }
libp2p-stream = "0.5.0-alpha"
prost = "0.13"
rustls-pemfile = "2"
rig = { version = "=0.42.0", default-features = false, features = ["agent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
